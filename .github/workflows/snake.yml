name: Contribution snake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]
  schedule:
    - cron: "0 */12 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # ink-grey cells, the snake is the lucky-clover green
          outputs: |
            dist/snake-light.svg?color_snake=#4fa35f&color_dots=#ebeae6,#c4c4c4,#8f8f8f,#555555,#141414
            dist/snake-dark.svg?palette=github-dark&color_snake=#4fa35f&color_dots=#161b22,#333333,#626262,#9a9a9a,#e6e6e6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
