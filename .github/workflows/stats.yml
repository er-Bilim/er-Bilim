name: Update README cards

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # ink on paper, matches the header; green ring = the lucky clover
          options: username=er-Bilim&role=OWNER,ORGANIZATION_MEMBER&show_icons=true&include_all_commits=true&hide=contribs&bg_color=fbfaf6&border_color=141414&title_color=141414&icon_color=141414&text_color=2a2a2a&ring_color=4fa35f&border_radius=16
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase
          git push
