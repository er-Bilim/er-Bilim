name: Update README cards

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=er-Bilim&role=OWNER,ORGANIZATION_MEMBER&show_icons=true&include_all_commits=true&bg_color=161b22&border_color=21262d&title_color=7ea88a&icon_color=5f8a6d&text_color=c9d1d9&ring_color=7ea88a
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=er-Bilim&layout=compact&langs_count=8&bg_color=161b22&border_color=21262d&title_color=7ea88a&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase
          git push
