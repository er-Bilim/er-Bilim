name: Clover island

# Redraws the floating island when Bishkek time moves to morning (06-11), day (11-18),
# evening (18-22) or night (22-06):
# weather from this week's commits, season, holidays, rare events, island growth,
# language districts from WakaTime and the daily four-leaf clover.
on:
  workflow_dispatch:
  schedule:
    # every hour: GitHub delays or skips scheduled runs, so hourly checks catch the
    # morning / day / evening / night switch (Bishkek time) within an hour.
    # A commit only happens when the pictures actually change.
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/clover/**"
      - ".github/workflows/clover.yml"

concurrency:
  group: clover
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - name: Draw
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/clover/build.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0   # pictures unchanged: no commit
          git add scripts/clover/cache.json
          git commit -m "Clover: redraw island"
          git pull --rebase
          git push
