name: Clover island

# Redraws the floating island four times a day (Bishkek morning / day / evening / night):
# weather from this week's commits, season, holidays, rare events, island growth,
# language districts from WakaTime and the daily four-leaf clover.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 1 * * *"   # 07:07 Bishkek, morning
    - cron: "7 7 * * *"   # 13:07, day
    - cron: "7 13 * * *"  # 19:07, evening
    - cron: "7 17 * * *"  # 23:07, night
  push:
    branches: [main]
    paths:
      - "scripts/clover/**"
      - ".github/workflows/clover.yml"

concurrency:
  group: clover
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - name: Draw
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/clover/build.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/clover/cache.json
          git diff --cached --quiet && exit 0
          git commit -m "Clover: redraw island"
          git pull --rebase
          git push
